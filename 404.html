<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Show Rumba Latina...</title>
  <script>
    (function () {
      var target = window.location.hostname === 'showrumbalatina.github.io'
        ? '/'
        : '/showrumbalatina/';
      if (window.location.pathname !== target) {
        window.location.replace(target);
      }
    })();

</head>

  <a href="/" id="fallback-home" style="color: #0a0a0f; background: #fed542; padding: 0.75rem 1.5rem; border-radius: 9999px; text-decoration: none; font-weight: 700;">
    Ir a Show Rumba Latina
  </a>
  <script>
    document.getElementById('fallback-home').href =
      window.location.hostname === 'showrumbalatina.github.io' ? '/' : '/showrumbalatina/';
  </script>
</body>
</html>
